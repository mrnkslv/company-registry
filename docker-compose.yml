services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      HTTP_LISTEN_ADDRESS: ":8080"
      PG_DSN_COMPANY_REGISTRY: "postgres://postgres:qwerty@db:5432/company_registry?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: company_registry
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_registry"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: