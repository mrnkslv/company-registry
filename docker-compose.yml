services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      HTTP_LISTEN_ADDRESS: ":8080"
      PG_DSN_COMPANY_REGISTRY: "postgres://postgres:qwerty@db:5432/company_registry?sslmode=disable"
      AUTH_SALT: "jfghdlkoviojkfdko"
      AUTH_SIGNING_KEY: "fhvjiokig98y##6785409396"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: company_registry
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_registry"]
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.1.0
    restart: always
    environment:
      # Single-node KRaft cluster (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by the app inside compose, EXTERNAL by tools on the host (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  pgdata: